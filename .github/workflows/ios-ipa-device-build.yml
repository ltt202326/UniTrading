name: iOS unsigned device build
on:
  push:
    branches: ['build/ios-ipa-20261119']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK used by the multiplatform build
        run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build unsigned iOS device application
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/UniTradingDevice" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee "$RUNNER_TEMP/ios-device-build.log"
      - name: Package unsigned IPA and validate contents
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/UniTradingDevice/Build/Products/Debug-iphoneos/UniTrading.app"
          test -x "$APP_PATH/UniTrading"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/UniTrading.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/UniTrading-iOS-Unsigned-Debug.ipa" Payload)
          unzip -t dist/UniTrading-iOS-Unsigned-Debug.ipa | tail -1
          shasum -a 256 dist/UniTrading-iOS-Unsigned-Debug.ipa > dist/SHA256SUMS.txt
      - name: Upload unsigned iOS device build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-iOS-Unsigned-Debug
          path: dist/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-iOS-Build-Logs
          path: ${{ runner.temp }}/ios-device-build.log
          if-no-files-found: ignore
