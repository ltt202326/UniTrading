name: Desktop chart fullscreen verification
on:
  push:
    branches: ['build/chart-fullscreen-183']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 11213eb6d364005f2b2db61a084ddd5e9e82bace
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Fullscreen and trading regression
        shell: pwsh
        run: |
          ./gradlew.bat :composeApp:desktopTest --tests '*DesktopChartFullscreenUiTest*' --tests '*KeyboardTradingUiTest*' --tests '*ChartContextMenuUiTest*' --tests '*DesktopWorkspaceTabsUiTest*' --tests '*ProtectionUiTest*' --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows
        run: ./gradlew.bat :composeApp:createDistributable --no-daemon
      - name: Verify and archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          if (-not (Test-Path "$app/UniTrading.exe")) { throw 'Windows executable missing' }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Login host missing' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath 'dist/UniTrading-1.8.3-windows-fullscreen-x64.zip'
          Get-FileHash 'dist/UniTrading-1.8.3-windows-fullscreen-x64.zip' -Algorithm SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-1.8.3-windows-fullscreen-x64
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fullscreen-windows-tests
          path: |
            composeApp/build/test-results/desktopTest
            artifacts/fullscreen
          if-no-files-found: warn
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 11213eb6d364005f2b2db61a084ddd5e9e82bace
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Fullscreen and keyboard regression
        run: ./gradlew :composeApp:desktopTest --tests '*DesktopChartFullscreenUiTest*' --tests '*KeyboardTradingUiTest*' --no-daemon
      - name: Build macOS
        run: ./gradlew :composeApp:createDistributable --no-daemon
      - name: Verify and archive
        run: |
          set -euo pipefail
          app=composeApp/build/compose/binaries/main/app/UniTrading.app
          host="$app/Contents/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin"
          test -x "$host"
          "$host" --self-test
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/UniTrading-1.8.3-macos-arm64-fullscreen.zip"
          shasum -a 256 dist/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-1.8.3-macos-arm64-fullscreen
          path: dist/*.zip
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fullscreen-macos-tests
          path: composeApp/build/test-results/desktopTest
          if-no-files-found: warn
