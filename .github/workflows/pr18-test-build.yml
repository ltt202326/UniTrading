name: PR18 test builds
on:
  push:
    branches: [build/pr18-d42c554]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: ./gradlew.bat :composeApp:createDistributable
      - name: Verify and pack Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          if (-not (Test-Path "$app/UniTrading.exe")) { throw 'Executable missing' }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Login host missing' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath 'dist/UniTrading-PR18-Windows-x64.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PR18-Windows
          path: dist/*.zip
          compression-level: 0
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: ./gradlew :androidApp:assembleStandardRelease --no-daemon
      - name: Sign and verify test APK
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          input=androidApp/build/outputs/apk/standard/release/androidApp-standard-release-unsigned.apk
          test -f "$input"
          keytool -genkeypair -keystore "$RUNNER_TEMP/pr18-test.keystore" -storepass temporarytest -keypass temporarytest -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=UniTrading PR18 Test' -noprompt
          mkdir -p dist
          "$build_tools/zipalign" -f 4 "$input" "$RUNNER_TEMP/pr18-aligned.apk"
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/pr18-test.keystore" --ks-key-alias test --ks-pass pass:temporarytest --key-pass pass:temporarytest --out dist/UniTrading-PR18-Android-test.apk "$RUNNER_TEMP/pr18-aligned.apk"
          "$build_tools/apksigner" verify --verbose --print-certs dist/UniTrading-PR18-Android-test.apk
          "$build_tools/aapt2" dump badging dist/UniTrading-PR18-Android-test.apk | head -n 3
          rm -f "$RUNNER_TEMP/pr18-test.keystore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PR18-Android-test
          path: dist/*.apk
          compression-level: 0
          if-no-files-found: error
