name: UniTrading 1.8.3 Windows verification
on:
  push:
    branches: ['build/windows-1.8.3-protection-titlebar']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 162ac90404904241b604d45e61f07cf3e9792f6b
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Protection and native window tests
        run: ./gradlew.bat :composeApp:desktopTest --tests '*AccountRiskTest*' --tests '*AccountBracketsTest*' --tests '*WindowsTitleBarUiTest*' --tests '*DesktopWorkspaceTabsUiTest*' --tests '*TradingScreenTest.pendingStopDragMayExceedConfiguredCashRisk*' --tests '*TradingScreenTest.pendingStopLossDragWaitsForConfirmation*' --tests '*TradingScreenTest.directPositionProtectionDropAppliesOnceReleased*' --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-1.8.3-test-results
          path: |
            composeApp/build/test-results/desktopTest
            artifacts/desktop-tabs
          if-no-files-found: warn
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 162ac90404904241b604d45e61f07cf3e9792f6b
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build Windows
        run: ./gradlew.bat :composeApp:createDistributable --no-daemon
      - name: Verify and archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          if (-not (Test-Path "$app/UniTrading.exe")) { throw 'Windows executable missing' }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Login host missing' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath 'dist/UniTrading-1.8.3-windows-x64.zip'
          Get-FileHash 'dist/UniTrading-1.8.3-windows-x64.zip' -Algorithm SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-1.8.3-windows-x64
          path: dist/UniTrading-1.8.3-windows-x64.zip
          if-no-files-found: error
