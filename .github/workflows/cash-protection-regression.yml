name: Cash protection regression
on:
  push:
    branches: ["codex-test/cash-protection-20261126"]
permissions:
  contents: read
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install "platforms;android-37.0" "platforms;android-37.2"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Exercise order lines, risk checks and offline UI
        run: xvfb-run -a ./gradlew :composeApp:desktopTest --tests 'com.unitrading.chart.OrderLinesTest' --tests 'com.unitrading.app.AccountBracketsTest' --tests 'com.unitrading.ui.AccountRiskTest' --tests 'com.unitrading.ui.AccountBracketsUiTest' --tests 'com.unitrading.ui.ProtectionUiTest' --stacktrace
      - name: Exercise offline Tradovate protection classification
        run: ./gradlew :tradovate-broker:desktopTest --tests 'com.unitrading.tradovate.ProtectionClassificationTest' --tests 'com.unitrading.tradovate.ProtectionBrokerIntegrationTest' --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cash-protection-test-results
          path: |
            composeApp/build/reports/tests/desktopTest
            composeApp/build/test-results/desktopTest
            tradovate-broker/build/reports/tests/desktopTest
            tradovate-broker/build/test-results/desktopTest
          if-no-files-found: ignore
  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install "platforms;android-37.0" "platforms;android-37.2"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: ./gradlew :composeApp:compileKotlinIosArm64 --stacktrace
