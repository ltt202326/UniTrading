name: PR23 Windows test build
on:
  push:
    branches: [build/pr23-replay-70-v1]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build Windows application
        run: ./gradlew.bat :composeApp:createDistributable --no-daemon
      - name: Verify and pack Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          if (-not (Test-Path "$app/UniTrading.exe")) { throw 'Executable missing' }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Login host missing' }
          Get-FileHash "$app/UniTrading.exe" -Algorithm SHA256 | Format-List
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath 'dist/UniTrading-PR23-Replay70-test-Windows-x64.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PR23-Windows-portable
          path: dist/UniTrading-PR23-Replay70-test-Windows-x64.zip
          compression-level: 0
          if-no-files-found: error
      - name: Build MSI installer
        id: msi
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wix = Get-ChildItem 'C:/Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($wix) { "$($wix.FullName)/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append; $env:PATH = "$($wix.FullName)/bin;$env:PATH" }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) { choco install wixtoolset --version=3.14.1 -y --no-progress; if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }; $wix = Get-ChildItem 'C:/Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Sort-Object Name -Descending | Select-Object -First 1; if (-not $wix) { throw 'WiX 3 not found' }; $env:PATH = "$($wix.FullName)/bin;$env:PATH" }
          ./gradlew.bat :composeApp:packageMsi --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'MSI packaging failed' }
          $msi = Get-ChildItem 'composeApp/build/compose/binaries/main/msi/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI missing' }
          Copy-Item $msi.FullName 'dist/UniTrading-PR23-Replay70-test-Windows-x64.msi'
          Get-FileHash 'dist/UniTrading-PR23-Replay70-test-Windows-x64.msi' -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.msi.outcome == 'success'
        with:
          name: PR23-Windows-installer
          path: dist/UniTrading-PR23-Replay70-test-Windows-x64.msi
          compression-level: 0
          if-no-files-found: error
