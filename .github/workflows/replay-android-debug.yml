name: Tablet Android debug
on:
  push:
    branches: ['build/replay-android-debug-183']
permissions:
  contents: read
jobs:
  apk:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: ./gradlew.bat :androidApp:assembleStandardDebug --no-daemon
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'androidApp/build/outputs/apk/standard/debug/androidApp-standard-debug.apk' 'dist/UniTrading-1.8.3-replay-fix-android-debug.apk'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-1.8.3-replay-fix-android-debug
          path: dist/*.apk
          if-no-files-found: error
