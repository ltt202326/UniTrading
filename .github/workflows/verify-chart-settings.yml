name: Verify chart labels and settings
on:
  push:
    branches: ['build/main-chart-settings-20261125']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Verify chart, settings, and replay UI
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24' ./gradlew :composeApp:desktopTest
          --tests '*ContinuousContractUiTest*'
          --tests '*SettingsPageTest*'
          --tests '*PineChartUiTest*'
          --tests '*CandleZoomUiTest*'
          --tests '*HistoricalReplayUiTest*'
          --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Chart-Settings-Test-Results
          path: composeApp/build/test-results/desktopTest/*.xml
          if-no-files-found: warn
