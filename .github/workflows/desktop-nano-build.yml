name: Workspace routing diagnostic and cross-platform packages
on:
  push:
    branches: ['build/codex-window-completion-20261119']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Verify detached-window interactions
        run: |
          set -o pipefail
          tests=( :composeApp:desktopTest --tests '*DesktopDetachedWorkspaceUiTest.detachedSubaccountStaysIndependentAndTradesItsOwnAccount*' )
          if ! xvfb-run -a ./gradlew "${tests[@]}" --no-daemon 2>&1 | tee "$RUNNER_TEMP/first-tests.log"; then
            if grep -Eq 'Could not resolve all artifacts|Could not find org\.jetbrains\.kotlin' "$RUNNER_TEMP/first-tests.log"; then
              xvfb-run -a ./gradlew "${tests[@]}" --no-daemon --refresh-dependencies
            else
              exit 1
            fi
          fi
      - name: Preserve detached-window test results
        run: |
          mkdir -p artifacts/detached-test-results
          cp composeApp/build/test-results/desktopTest/*.xml artifacts/detached-test-results/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Desktop-Nano-Test-Results
          path: |
            artifacts/**
            composeApp/build/test-results/desktopTest/*.xml
            tradovate-broker/build/test-results/desktopTest/*.xml
          if-no-files-found: warn
