name: Build UniTrading Windows test package
on:
  push:
    branches: ["build/windows-indicator-20261117"]
permissions:
  contents: read
jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK used by Gradle
        run: sdkmanager --install "platforms;android-37.0" "platforms;android-37.2"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build Windows app
        run: ./gradlew.bat :composeApp:createDistributable
      - name: Verify and archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          if (-not (Test-Path "$app/UniTrading.exe")) { throw 'Windows app missing' }
          $hostPath = "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe"
          if (-not (Test-Path $hostPath)) { throw 'Tradovate login host missing' }
          $selfTest = & $hostPath --self-test | Out-String
          Write-Output $selfTest
          if ($selfTest -notmatch 'SELF_TEST PASS 60') { throw 'Login host self-test failed' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath "dist/UniTrading-1.6.0-Indicator-Styles-Windows-x64-Test.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-Indicator-Styles-Windows
          path: dist/*-windows-x64-Test.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
