name: Tablet UI screenshots
on:
  push:
    branches: ['build/tablet-ui-screenshots-183-r5']
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Capture tablet UI with offline data
        run: ./gradlew.bat :composeApp:desktopTest --tests '*TabletScreenshotUiTest*' --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tablet-ui-screenshots
          path: |
            artifacts/tablet-screenshots
            composeApp/build/test-results/desktopTest
          if-no-files-found: error
