name: Build Beijing chart iOS IPA
on:
  push:
    branches: ["build/ios-beijing-chart-20261117"]
permissions:
  contents: read
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile for iPhone and iPad without signing
        run: |
          chmod +x gradlew
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos/UniTrading.app" "$RUNNER_TEMP/ipa/Payload/UniTrading.app"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --keepParent Payload "$RUNNER_TEMP/UniTrading-1.6.0-Beijing-Chart-Time-unsigned.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-Beijing-Chart-iOS-unsigned
          path: ${{ runner.temp }}/UniTrading-1.6.0-Beijing-Chart-Time-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
