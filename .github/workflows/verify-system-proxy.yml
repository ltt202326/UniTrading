name: Verify desktop system proxy
on:
  push:
    branches: ['build/verify-system-proxy-20261126']
permissions:
  contents: read
jobs:
  broker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Verify Tradovate, Rithmic, and proxy routing
        run: |
          ./gradlew :tradovate-broker:desktopTest :rithmic-broker:desktopTest --no-daemon
          ./gradlew :composeApp:desktopTest --tests 'com.unitrading.SystemProxyTest.brokerRequestsAndReconnectsFollowTheJvmProxySelector' --tests 'com.unitrading.SystemProxyTest.brokerWebSocketCanUseExplicitSocksProxy' --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: System-Proxy-Broker-Results
          path: |
            composeApp/build/test-results/desktopTest/*.xml
            tradovate-broker/build/test-results/desktopTest/*.xml
            rithmic-broker/build/test-results/desktopTest/*.xml
          if-no-files-found: warn
  windows:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Compile, exercise proxy routing, and package Windows app
        run: ./gradlew.bat :composeApp:desktopTest --tests '*brokerRequestsAndReconnectsFollowTheJvmProxySelector' --tests '*brokerWebSocketCanUseExplicitSocksProxy' :composeApp:createDistributable --no-daemon
      - name: Verify packaged JVM proxy flag
        shell: pwsh
        run: |
          $config = Get-Content 'composeApp/build/compose/binaries/main/app/UniTrading/app/UniTrading.cfg' -Raw
          if (-not $config.Contains('-Djava.net.useSystemProxies=true')) { throw 'System proxy JVM flag missing from packaged application' }
      - name: Configure isolated runner system proxy
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $settings = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          Set-ItemProperty -Path $settings -Name ProxyEnable -Type DWord -Value 1
          Set-ItemProperty -Path $settings -Name ProxyServer -Type String -Value "127.0.0.1:$port"
          Set-ItemProperty -Path $settings -Name ProxyOverride -Type String -Value '<local>'
          Set-ItemProperty -Path $settings -Name AutoDetect -Type DWord -Value 0
          Remove-ItemProperty -Path $settings -Name AutoConfigURL -ErrorAction SilentlyContinue
          "UNITRADING_TEST_WINDOWS_SYSTEM_PROXY=$port" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify actual Windows system proxy
        env:
          JAVA_TOOL_OPTIONS: -Djava.net.useSystemProxies=true
        run: ./gradlew.bat :composeApp:desktopTest --tests '*brokerRequestsFollowWindowsSystemProxy' --offline --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: System-Proxy-Windows-Results
          path: composeApp/build/test-results/desktopTest/*.xml
          if-no-files-found: warn
  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Compile broker modules for iOS
        run: ./gradlew :broker-api:compileKotlinIosArm64 :tradovate-broker:compileKotlinIosArm64 :rithmic-broker:compileKotlinIosArm64 --no-daemon
