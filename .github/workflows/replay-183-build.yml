name: Replay UI and overnight PnL Windows
on:
  push:
    branches: ['build/replay-183-20261126']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ad165303820482e52cb13e3762b3d09aa0fd9b24
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Replay UI, overnight and risk regression
        run: ./gradlew.bat :composeApp:desktopTest --tests '*ReplayRiskTest*' --tests '*ReplayDailyRiskTest*' --tests '*HistoricalReplayUiTest*' --tests '*ReplayDailyLossUiTest*' --tests '*ReplayConsistencyUiTest*' --tests '*ReplaySetupUiTest*' --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-183-test-results
          path: |
            composeApp/build/test-results/desktopTest
            composeApp/build/replay-consistency-ui
          if-no-files-found: warn
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ad165303820482e52cb13e3762b3d09aa0fd9b24
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build Windows
        run: ./gradlew.bat :composeApp:createDistributable --no-daemon
      - name: Verify and archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          if (-not (Test-Path "$app/UniTrading.exe")) { throw 'Windows executable missing' }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Login host missing' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath 'dist/UniTrading-1.8.3-windows-replay-x64.zip'
          Get-FileHash 'dist/UniTrading-1.8.3-windows-replay-x64.zip' -Algorithm SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-1.8.3-windows-replay-x64
          path: dist/*.zip
          if-no-files-found: error
