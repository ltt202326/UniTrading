name: Mobile chart verification
on:
  push:
    branches: ['verify/mobile-chart-20261127-1795715351505']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Mobile chart and desktop regression
        run: xvfb-run -a ./gradlew :composeApp:desktopTest --tests '*MobileLayoutTest.phoneContextOrderAllowsChartQuantityEditAndRequiresConfirmation' --tests '*ChartContextMenuUiTest*' --tests '*PriceAxisUiTest*' --tests '*OrderFlowUiTest.tabletCanOpenFourChartLayout*' --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-chart-test-results
          path: composeApp/build/test-results/desktopTest/*.xml
          if-no-files-found: warn
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: ./gradlew :androidApp:assembleStandardDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-chart-android-debug
          path: androidApp/build/outputs/apk/standard/debug/androidApp-standard-debug.apk
          if-no-files-found: error
