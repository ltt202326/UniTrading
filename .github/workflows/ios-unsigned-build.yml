name: Build unsigned UniTrading iOS IPA

on:
  push:
    branches: ["build/ios-unsigned-*"]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract supplied source
        run: |
          cat build-input/source.part* > "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          chmod +x "$RUNNER_TEMP/source/UniTrading-1.6.0-Market-VWAP/gradlew"
      - name: Compile for iPhone and iPad without signing
        working-directory: ${{ runner.temp }}/source/UniTrading-1.6.0-Market-VWAP
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos/UniTrading.app" "$RUNNER_TEMP/ipa/Payload/UniTrading.app"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --keepParent Payload "$RUNNER_TEMP/UniTrading-1.6.0-Market-VWAP-unsigned.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniTrading-iOS-unsigned
          path: ${{ runner.temp }}/UniTrading-1.6.0-Market-VWAP-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
